<!DOCTYPE html>
<html>
<head>
    <title>Fast Airlines - User Registration</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, Helvetica, sans-serif;
        }

        body{
            background:#eaf2ff;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .container{
            width:420px;
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 5px 20px rgba(0,0,0,0.2);
        }

        h2{
            text-align:center;
            color:#123a7a;
            margin-bottom:20px;
        }

        label{
            font-weight:bold;
            color:#333;
        }

        input, select{
            width:100%;
            padding:10px;
            margin:8px 0 15px;
            border:1px solid #ccc;
            border-radius:8px;
        }

        .gender{
            display:flex;
            gap:20px;
            margin:10px 0 15px;
        }

        .gender input{
            width:auto;
        }

        .btn{
            width:100%;
            background:#2f5bd3;
            color:white;
            border:none;
            padding:12px;
            font-size:16px;
            border-radius:25px;
            cursor:pointer;
        }

        .btn:hover{
            background:#1f49b8;
        }

        p{
            text-align:center;
            margin-top:15px;
        }

        a{
            color:#2f5bd3;
            text-decoration:none;
            font-weight:bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>✈ Fast Airlines</h2>

    <form action="t1" method="post">

        <label>Full Name</label>
        <input type="text" name="n1" placeholder="Enter your name" required>

        <label>Email</label>
        <input type="email" name="n2" placeholder="Enter email" required>

        <label>Password</label>
        <input type="password" name="n3" placeholder="Create password" required>

        <label>Address</label>
        <input type="text" name="n4" placeholder="Enter address" required>

        <label>Gender</label>
        <div class="gender">
            <label><input type="radio" name="n5" value="Male" required> Male</label>
            <label><input type="radio" name="n5" value="Female"> Female</label>
        </div>

        <label>Security Question</label>
        <select name="n6">
            <option>What is your pet name?</option>
            <option>What is your birth place?</option>
            <option>What is your favourite color?</option>
        </select>

        <label>Answer</label>
        <input type="text" name="n7" placeholder="Enter answer" required>

        <label>Contact Number</label>
        <input type="tel" name="n8" placeholder="10-digit mobile number" required>

        <input type="submit" value="submit" >
        <input type="reset" value="reset">

    </form>

    <p>Already registered?
        <a href="login2.html">Login Here</a>
    </p>

</div>

</body>
</html>
