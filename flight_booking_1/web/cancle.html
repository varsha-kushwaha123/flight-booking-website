<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Cancel Ticket</title>

<style>
body{
    font-family:Arial;
    background:#eef5ff;
}
.box{
    width:400px;
    margin:80px auto;
    background:white;
    padding:25px;
    border-radius:10px;
    box-shadow:0 0 10px gray;
}
h2{
    color:#0d6efd;
    text-align:center;
}
input{
    width:100%;
    padding:10px;
    margin:15px 0;
}
button{
    width:100%;
    padding:12px;
    background:#dc3545;
    color:white;
    border:none;
    cursor:pointer;
}
</style>
</head>

<body>

<div class="box">

<h2>Cancel Flight Ticket</h2>

<form action="cancelservlet" method="post">

<label>Enter Booking ID</label>

<input type="number" name="booking_id" required>

<button type="submit">View Booking</button>

</form>

</div>

</body>
</html>
