<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Search Flights</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    background:#eaf4ff;
}

header{
    background:#0d6efd;
    color:white;
    padding:18px;
    text-align:center;
}

.container{
    width:450px;
    margin:40px auto;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.2);
}

h2{
    text-align:center;
    color:#0d6efd;
    margin-bottom:20px;
}

label{
    font-weight:bold;
    display:block;
    margin-top:12px;
    margin-bottom:5px;
}

input,select{
    width:100%;
    padding:10px;
    border:1px solid #bbb;
    border-radius:6px;
    font-size:15px;
}

button{
    width:100%;
    margin-top:25px;
    padding:12px;
    background:#0d6efd;
    color:white;
    border:none;
    border-radius:6px;
    font-size:17px;
    cursor:pointer;
}

button:hover{
    background:#084298;
}
</style>
</head>

<body>

<header>
    <h1>Flight Reservation System</h1>
</header>

<div class="container">

<h2>Search Flights</h2>

<form action="search_availability" method="post">

<label>From</label>
<select name="from" required>
<option value="">Select City</option>
<option>Delhi</option>
<option>Mumbai</option>
<option>Kolkata</option>
<option>Chennai</option>
<option>Bangalore</option>
</select>

<label>To</label>
<select name="to" required>
<option value="">Select City</option>
<option>Delhi</option>
<option>Mumbai</option>
<option>Kolkata</option>
<option>Chennai</option>
<option>Bangalore</option>
</select>

<label>Journey Date</label>
<input type="date" name="date" required>

<label>Passengers</label>
<input type="number" name="passengers" min="1" max="6" value="1" required>

<label>Class</label>
<select name="class" required>
<option>Economy</option>
<option>Business</option>
<option>First Class</option>
</select>

<button type="submit">Search Flights</button>

</form>

</div>

</body>
</html>
